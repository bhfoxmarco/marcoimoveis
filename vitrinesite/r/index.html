<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!--
=============================================================================
  PROJETO : Marco Imóveis · Encurtador de Links
  ARQUIVO : r/index.html
  AUTOR   : Marco Silva · Corretor Parceiro QuintoAndar
  VERSÃO  : 1.1

  CHANGELOG (últimas 3 versões):
    v1.0 - 18/06/2026: Criação do encurtador de links próprio
                       Lê links.json do GitHub e redireciona automaticamente

  OBJETIVO:
    Encurtar links longos da apresentação de imóveis.
    Link curto: marcoimoveis.com.br/r/abc123
    Redireciona para: marcoimoveis.com.br/videoimoveis/?id=...&rua=...

  COMO FUNCIONA:
    1. Extensão gera link longo da apresentação
    2. Extensão salva o link no links.json via API do GitHub
    3. Extensão gera link curto: marcoimoveis.com.br/r/CODIGO
    4. Cliente abre o link curto
    5. Esta página lê o links.json e redireciona para o link longo

  PRÉ-REQUISITOS:
    - Arquivo links.json no repositório bhfoxmarco/marcoimoveis/r/links.json
    - GitHub Pages ativo em marcoimoveis.com.br
=============================================================================
-->
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Marco Imóveis · Redirecionando...</title>
<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#0f2444;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;margin:0;flex-direction:column;gap:20px;
  }
  .marca{font-size:28px;font-weight:900;color:#C9A84C;letter-spacing:-0.02em}
  .marca span{color:#fff}
  .msg{font-size:14px;color:rgba(255,255,255,0.50);letter-spacing:0.06em}
  .bar{width:120px;height:2px;background:rgba(255,255,255,0.12);border-radius:2px;overflow:hidden}
  .bar-fill{height:100%;background:#C9A84C;animation:load 1.2s ease-in-out infinite}
  @keyframes load{0%{margin-left:-100%;width:100%}100%{margin-left:100%;width:100%}}
</style>
</head>
<body>
  <div class="marca">Marco<span>Imóveis</span></div>
  <div class="bar"><div class="bar-fill"></div></div>
  <div class="msg" id="msg">Redirecionando...</div>

<script>
// Lê o código da URL: marcoimoveis.com.br/r/?c=abc123
var codigo = new URLSearchParams(location.search).get('c');

if (!codigo) {
  document.getElementById('msg').textContent = 'Link inválido.';
} else {
  // Busca o links.json no GitHub Pages
  fetch('/vitrinesite/r/links.json?t=' + Date.now() + Math.random())
    .then(function(r) { return r.json(); })
    .then(function(links) {
      var destino = links[codigo];
      if (destino) {
        window.location.replace(destino);
      } else {
        document.getElementById('msg').textContent = 'Link não encontrado ou expirado.';
      }
    })
    .catch(function() {
      document.getElementById('msg').textContent = 'Erro ao carregar. Tente novamente.';
    });
}
</script>
</body>
</html>
